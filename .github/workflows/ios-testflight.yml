name: iOS → TestFlight

# Déclenchement : à la main (onglet Actions) ou en poussant un tag vX.Y.Z
on:
  workflow_dispatch:
  push:
    branches: [nour-ios]
    tags: ['v*']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      # Team ID "Said Mada" (pas un secret). Peut être surchargé par le secret APPLE_TEAM_ID.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'K5UVR8V6H7' }}
      # Clé .p8 : PEM brut (secret APP_STORE_CONNECT_PRIVATE_KEY) ou base64 (APP_STORE_CONNECT_KEY_P8)
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 || secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets
        run: |
          for v in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APPLE_TEAM_ID ASC_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Secret manquant : $v"; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_POSTHOG_PROJECT_TOKEN: ${{ secrets.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

      - name: Synchroniser Capacitor iOS
        run: npx cap sync ios

      - name: Choisir Xcode
        run: |
          # Apple exige un build avec le SDK iOS récent : on prend le Xcode le plus récent du runner
          ls -d /Applications/Xcode_*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Clé App Store Connect (API)
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
          if printf '%s' "$ASC_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY" > "$KEYFILE"
          else
            printf '%s' "$ASC_KEY" | base64 --decode > "$KEYFILE"
          fi
          head -1 "$KEYFILE" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::Clé .p8 illisible"; exit 1; }

      - name: Numéro de build + version
        id: ver
        run: |
          # Version marketing : tag vX.Y.Z si présent, sinon MARKETING_VERSION du projet Xcode
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; else
            VERSION=$(grep -m1 MARKETING_VERSION ios/App/App.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/'); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION ($GITHUB_RUN_NUMBER)"

      - name: Archive
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}"

      - name: Export + envoi vers TestFlight
        working-directory: ios
        run: |
          sed -i '' "s/__TEAM_ID__/$APPLE_TEAM_ID/" ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Conserver l'archive (dSYM / logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: ${{ runner.temp }}/export
          if-no-files-found: ignore
          retention-days: 7
